{% set name = "album-docker" %}
{% set version = "0.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/album_docker-{{ version }}.tar.gz
  sha256: 8a992716464d7b283da1ff2f8a10e0f74daafd0930757aadb85b96d40775b460

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0


requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=42
  run:
    - python >={{ python_min }}
    - album >=1.0.0,<2.0.0
    - docker-py

test:
  imports:
    - album
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://album.solutions
  summary: album plugin for building docker images from solutions
  dev_url: https://gitlab.com/album-app/plugins/album-docker
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jpalbrecht
